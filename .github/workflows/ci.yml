name: Verify color engine
on: [push, pull_request]
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - run: npm run check
      - run: npm test
      - run: python3 scripts/build-portable.py
      - run: git diff --exit-code -- index.html .nojekyll
